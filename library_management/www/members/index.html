{% extends "templates/web.html" %}

{% block title %}Library Members{% endblock %}

{% block page_content %}
<div class="container mt-5">
    <h1>Our Members</h1>
    <div class="row">
        {% for member in members %}
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">{{ member.first_name }} {{ member.last_name }}</h5>
                    <p class="card-text">
                        <strong>Email:</strong> {{ member.email }}<br>
                        <strong>Member Since:</strong> {{ member.membership_date }}
                    </p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
